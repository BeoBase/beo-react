name: React CI

on:
  push:
    branches: [ "**" ] # Run on every push
  pull_request:
    branches: [ main ] # Run on PRs targeting main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CI: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

#      - name: Run tests with coverage
#        run: npm run coverage

      - name: Build React app
        run: npm run build

